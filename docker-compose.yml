name: it-prod

services:

  # ==========================================
  # BLOQUE 1: PROYECTO BEATEMPLATE
  # ==========================================

  db-beatemplate:
    image: postgres:18

    restart: always

    volumes:
      - beatemplate_postgres_data:/var/lib/postgresql/data

    env_file:
      - .env

    environment:
      - POSTGRES_DB=${POSTGRES_DB_BEATEMPLATE}
      - POSTGRES_USER=${POSTGRES_USER_BEATEMPLATE}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_BEATEMPLATE}
      - PGDATA=/var/lib/postgresql/data/pgdata

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_BEATEMPLATE} -d ${POSTGRES_DB_BEATEMPLATE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web-beatemplate:
    build: ./TrabajoDjangoIT

    command: >
      sh -c "python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn trabajo_it.wsgi:application --bind 0.0.0.0:8000"

    volumes:
      - ./TrabajoDjangoIT:/app
      - beatemplate_static_data:/app/staticfiles

    env_file:
      - .env

    environment:
      - DJANGO_SETTINGS_MODULE=trabajo_it.settings.prod

    depends_on:
      db-beatemplate:
        condition: service_healthy

  # ==========================================
  # BLOQUE 2: PROYECTO RESTEMPLATE (API)
  # ==========================================

  db-restemplate:
    image: postgres:18

    restart: always

    volumes:
      - restemplate_postgres_data:/var/lib/postgresql/data

    env_file:
      - .env

    environment:
      - POSTGRES_DB=${POSTGRES_DB_RESTEMPLATE}
      - POSTGRES_USER=${POSTGRES_USER_RESTEMPLATE}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_RESTEMPLATE}
      - PGDATA=/var/lib/postgresql/data/pgdata

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_RESTEMPLATE} -d ${POSTGRES_DB_RESTEMPLATE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web-api:
    build: ./TrabajoAPIDjangoIT

    command: >
      sh -c "python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn api_trabajo_it.wsgi:application --bind 0.0.0.0:8001"

    volumes:
      - ./TrabajoAPIDjangoIT:/app
      - restemplate_static_data:/app/staticfiles

    env_file:
      - .env

    environment:
      - DJANGO_SETTINGS_MODULE=api_trabajo_it.settings.prod

    depends_on:
      db-restemplate:
        condition: service_healthy

  # ==========================================
  # BLOQUE 3: SERVIDOR WEB FRONT-END (NGINX)
  # ==========================================

  nginx:
    image: nginx:alpine

    restart: always

    ports:
      - "8000:8000"
      - "8001:8001"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - beatemplate_static_data:/staticfiles_beatemplate
      - restemplate_static_data:/staticfiles_restemplate

    depends_on:
      - web-beatemplate
      - web-api

volumes:
  beatemplate_postgres_data:
  restemplate_postgres_data:
  beatemplate_static_data:
  restemplate_static_data:
