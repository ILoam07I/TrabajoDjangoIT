{% extends 'beatemplate/base.html' %}
{% block title %}Registro{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card bg-dark border-secondary shadow-lg">
                <div class="card-body p-5">
                    <h2 class="text-center text-success fw-bold mb-4"><i class="bi bi-person-plus me-2"></i>Únete a Sound Range</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ register_form.as_p }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">Crear Cuenta</button>
                        </div>
                    </form>
                    <p class="text-center text-muted mt-4 mb-0">¿Ya tienes cuenta? <a href="{% url 'beatemplate:login' %}" class="text-success text-decoration-none fw-bold">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
