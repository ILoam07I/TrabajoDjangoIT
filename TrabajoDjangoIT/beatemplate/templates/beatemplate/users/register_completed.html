{% extends 'beatemplate/base.html' %}
{% block title %}Registro Completado{% endblock %}

{% block content %}
<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card bg-dark border-secondary shadow-lg text-center p-5">
                <i class="bi bi-check-circle-fill display-1 text-success mb-4"></i>
                <h1 class="fw-bold text-white mb-3">¡Hola, {{ new_account.first_name }}!</h1>
                <p class="lead text-muted mb-4">
                    Tu cuenta ha sido creada con éxito. Ya puedes acceder a todas las funciones de la plataforma.
                </p>
                <div class="d-grid gap-2 col-sm-8 mx-auto mt-2">
                    <a href="{% url 'beatemplate:feed' %}" class="btn btn-success btn-lg fw-bold">
                        <i class="bi bi-house-door me-2"></i>Ir al Feed
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
